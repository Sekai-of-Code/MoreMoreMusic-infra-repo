apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: {{ .Values.app.name }}
data:
  # Application environment
  environment: {{ .Values.app.environment | quote }}
  domain: {{ .Values.app.domain | quote }}
  
  # Database configuration
  database-name: {{ .Values.postgresql.auth.database | quote }}
  database-host: {{ include "moremoremusic.postgresql.host" . | quote }}
  database-port: "5432"
  
  # Redis configuration
  redis-host: {{ include "moremoremusic.redis.host" . | quote }}
  redis-port: "6379"
  
  # AWS S3 configuration
  s3-bucket-name: "moremoremusic-media-{{ .Values.app.environment }}"
  aws-region: "ap-northeast-1"
  
  # Service discovery
  user-service-url: "http://{{ .Values.userService.name }}.{{ .Values.app.namespace }}.svc.cluster.local:{{ .Values.userService.service.port }}"
  music-service-url: "http://{{ .Values.musicService.name }}.{{ .Values.app.namespace }}.svc.cluster.local:{{ .Values.musicService.service.port }}"
  
  # Monitoring
  metrics-enabled: "true"
  metrics-port: "9090"
  
  # Logging
  log-level: "info"
  log-format: "json"