{{- if .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: {{ .Values.app.name }}
type: Opaque
data:
  username: {{ .Values.secrets.postgresql.username | b64enc }}
  password: {{ .Values.secrets.postgresql.password | b64enc }}
  postgres-password: {{ .Values.secrets.postgresql.postgresPassword | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: {{ .Values.app.name }}
type: Opaque
data:
  password: {{ .Values.secrets.redis.password | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: {{ .Values.app.name }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwt.secret | b64enc }}

---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: {{ .Values.app.name }}
type: Opaque
data:
  access-key-id: {{ .Values.secrets.aws.accessKeyId | b64enc }}
  secret-access-key: {{ .Values.secrets.aws.secretAccessKey | b64enc }}
{{- end }}