apiVersion: v1
kind: Namespace
metadata:
  name: moremoremusic-msa
  labels:
    name: moremoremusic-msa
    app.kubernetes.io/name: moremoremusic
    app.kubernetes.io/part-of: moremoremusic
---
# Network Security Policy for Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-network-policy
  namespace: moremoremusic-msa
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: moremoremusic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow MSA services to connect to Kafka
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: moremoremusic
    ports:
    - protocol: TCP
      port: 9092
  # Allow intra-cluster Kafka communication
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow Kafka inter-broker communication
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
---
# Network Security Policy for MSA Services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: msa-services-network-policy
  namespace: moremoremusic-msa
  labels:
    app.kubernetes.io/part-of: moremoremusic
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow inter-service communication
  - from:
    - podSelector:
        matchLabels:
          tier: backend
  # Allow external access to services
  - from: []
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 3001
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow connection to Kafka
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow external npm registry access (for container startup)
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
---
# Service Account for Kafka with minimal permissions
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-service-account
  namespace: moremoremusic-msa
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: moremoremusic
automountServiceAccountToken: false
---
# Service Account for MSA Services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msa-service-account
  namespace: moremoremusic-msa
  labels:
    app.kubernetes.io/part-of: moremoremusic
    tier: backend
automountServiceAccountToken: false
---
# Role for basic pod operations (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: msa-pod-reader
  namespace: moremoremusic-msa
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# RoleBinding for MSA services
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: msa-services-binding
  namespace: moremoremusic-msa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: msa-pod-reader
subjects:
- kind: ServiceAccount
  name: msa-service-account
  namespace: moremoremusic-msa
- kind: ServiceAccount
  name: kafka-service-account
  namespace: moremoremusic-msa