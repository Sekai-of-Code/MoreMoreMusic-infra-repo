apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: moremoremusic-msa
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: moremoremusic
    app.kubernetes.io/version: "8.1.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-secure
  namespace: moremoremusic-msa
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: moremoremusic
    app.kubernetes.io/version: "8.1.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: moremoremusic
        app.kubernetes.io/version: "8.1.0"
    spec:
      serviceAccountName: kafka-service-account
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: volume-permissions
          image: busybox:1.35
          command:
            [
              "sh",
              "-c",
              "chown -R 1000:1000 /var/kafka-logs && chmod -R 755 /var/kafka-logs",
            ]
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/kafka-logs
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: controller
          env:
            # KRaft mode configuration - simplified
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: CLUSTER_ID
              value: "4L6g3nShT-eMCtK--X86sw"
            # Simplified listener configuration
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Storage and replication
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-logs"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Performance and MSA optimizations
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_DELETE_TOPIC_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168" # 7 days for better data retention
            # JVM options optimized for production
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx768m -Xms768m"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35"
            # Monitoring and JMX (disabled for development to avoid port conflicts)
            - name: KAFKA_OPTS
              value: "-Dcom.sun.management.jmxremote=false"
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/kafka-logs
          resources:
            requests:
              memory: "768Mi"
              cpu: "300m"
            limits:
              memory: "1.5Gi"
              cpu: "800m"
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "kafka-broker-api-versions --bootstrap-server localhost:9092"
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "kafka-topics --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: kafka-storage
          hostPath:
            path: /tmp/kafka-data
            type: DirectoryOrCreate
